# Deploy to the DigitalOcean droplet.
#
# Split from release.yml on purpose: building an image is safe and automatic, applying it to the
# machine holding the only copy of a circle's report log is neither. This workflow needs an
# environment approval on `production`, and it takes a snapshot before it changes anything.
#
# What actually happens on the host is: snapshot, pull, MIGRATE, `up -d`. Traefik already owns :443
# and picks the new container up from its labels, so there is no reverse-proxy step here.
#
# THE MIGRATE STEP IS THE ONE THING THIS DIFFERS FROM A PLAIN RESTART BY, and it is deliberate.
# `serve` does not migrate, and the rule it enforces is that a container RESTART must not migrate —
# because a restart is something Docker does at 3am with nobody watching, and migrations are
# forward-only. A step in a workflow that already required a human approval is precisely the
# deliberate act that rule asks for. There is deliberately NO one-shot migrate service with
# `service_completed_successfully` in deploy/compose.yaml: that would run on every `up`, including
# an unattended restart, which is the exact failure the rule exists for.
#
# The split of what travels and what stays: the IMAGE and the COMPOSE FILE come from the SAME
# COMMIT, which is why this checks out the triggering release rather than whatever the default
# branch has become while the deploy waited for approval. The `.env` stays on the droplet, because
# it holds secrets and a secret routed through a pipeline is a secret in that pipeline's logs, its
# cache and every fork's pull-request context.

name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.2.0, edge, sha-<full>)"
        required: true
        default: edge
      source_ref:
        description: >-
          Commit or tag the image was built from. The compose file is taken from here, so it must
          match image_tag: sha-<full> -> <full>, 1.2.0 -> v1.2.0. `edge` is built from the tip of
          main, which moves — prefer sha-<full> for anything you care about being reproducible.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  # Never deploy twice at once: two `compose up` runs against one SQLite volume is exactly the
  # situation the single-writer design assumes cannot happen — and two `migrate` runs against one
  # database is worse.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / production
    runs-on: ubuntu-24.04

    # `packages: read` is here for one step: resolving the release tag to a manifest digest. The
    # deploy publishes nothing and needs no write anywhere.
    permissions:
      contents: read
      packages: read

    # Requires the `production` environment. Put a required reviewer on it in repository settings:
    # that is what makes a deploy a decision rather than a side effect of merging — and it is what
    # makes the migrate step below a deliberate act rather than an automatic one.
    environment:
      name: production
      url: https://${{ vars.TOD_DEPLOY_HOST }}

    # Do not deploy a build that failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # Resolved BEFORE the checkout, because it decides what the checkout takes.
      #
      # The image and the compose file must come from ONE commit. A deploy waits for a human on the
      # production environment, and `main` keeps moving while it waits — so checking out the default
      # branch would stage a compose file from a release this image was never built for. It would
      # not even look wrong: the run is green, the image is the pinned one, and the container comes
      # up with variables from somewhere else entirely.
      #
      # Values are passed through `env:` rather than interpolated into the script, so a crafted
      # dispatch input is data and never a line of shell (gate ACT001).
      - name: Resolve the image and the commit it was built from
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_REF: ${{ github.event.inputs.source_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            # The release that triggered this run. One commit, both values.
            tag="sha-${RUN_SHA}"
            ref="$RUN_SHA"
          else
            tag="$INPUT_TAG"
            ref="$INPUT_REF"
          fi
          [ -n "$tag" ] || { echo "FATAL: image_tag is empty." >&2; exit 1; }
          [ -n "$ref" ] || { echo "FATAL: source_ref is empty." >&2; exit 1; }

          # Reject these values, do not encode them.
          #
          # $GITHUB_OUTPUT is a line-oriented `name=value` file, so a value containing a newline is
          # not an odd value — it is extra RECORDS. An image_tag of
          # "edge<newline>image=ghcr.io/attacker/evil:x" appends a second `image=` line, the LAST
          # one wins, and the deploy pulls and starts whatever it names, on production, past the
          # environment approval that was meant to be the control.
          #
          # The delimiter form would stop the injection and then hand `docker pull` a two-line image
          # reference instead, which is not an improvement. Neither of these is ever anything but a
          # plain token, so the honest answer is to refuse.
          #
          # `case`, not `grep`: grep is LINE-oriented, so `grep -E '^[A-Za-z0-9._-]+$'` matches the
          # first line of a multiline value and waves this exact attack through. A shell pattern
          # tests the whole string, newline included.
          case "$tag" in
            -* | *[!A-Za-z0-9._-]*)
              echo "FATAL: image_tag must be an OCI tag: letters, digits, '.', '_', '-'." >&2
              exit 1 ;;
          esac
          # `..` is not legal in a git ref, and a leading dash would be read as an option by the
          # commands these values reach.
          case "$ref" in
            -* | *..* | *[!A-Za-z0-9._/-]*)
              echo "FATAL: source_ref must be a commit sha, tag or branch name." >&2
              exit 1 ;;
          esac
          [ "${#tag}" -le 128 ] || { echo "FATAL: image_tag exceeds 128 characters." >&2; exit 1; }
          [ "${#ref}" -le 255 ] || { echo "FATAL: source_ref exceeds 255 characters." >&2; exit 1; }

          {
            echo "tag=${tag}"
            echo "source_ref=${ref}"
            echo "tagged_image=ghcr.io/${REPO}:${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "deploying ${tag} from ${ref}"

      # `imagetools inspect` below talks to the registry rather than to a builder, but buildx is
      # set up explicitly rather than relied on being present: a deploy that fails on a missing
      # tool is a deploy that fails for a reason nobody reading the log would guess.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Read-only, and only so the tag below can be resolved to a digest. The deploy publishes
      # nothing.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RESOLVE THE TAG TO A MANIFEST DIGEST, and deploy that.
      #
      # `sha-<commit>` is still an OCI TAG. Its name is derived from a commit, which makes it look
      # immutable and does not make it so: a later push can move it, and this workflow waits for a
      # human on the production environment — so the approval and the pull are separated by however
      # long that takes. A digest is the manifest's own content address; moving a tag cannot change
      # what it names.
      #
      # It also closes a smaller window that exists on every deploy: `pull`, `run --rm migrate` and
      # `up -d` each resolve the image reference independently, so three separate lookups of one
      # mutable tag could in principle return three different images. Past this step there is one
      # reference for the whole deploy, and for every `docker compose up` on the box afterwards,
      # because it is what lands in `.env`.
      #
      # `imagetools inspect` reads the registry and pulls no layers. The shape is checked strictly:
      # this value is about to be written into `.env` on the droplet.
      - name: Resolve the tag to a manifest digest
        id: digest
        env:
          TAGGED_IMAGE: ${{ steps.release.outputs.tagged_image }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$TAGGED_IMAGE" --format '{{.Manifest.Digest}}')"
          # Checked in three parts, the same way the dispatch inputs above are: this value is about
          # to be written into `.env` on the droplet and handed to `docker pull`.
          case "$digest" in
            sha256:*) ;;
            *) echo "FATAL: ${TAGGED_IMAGE} resolved to ${digest}, which is not a sha256 digest." >&2
               exit 1 ;;
          esac
          hex="${digest#sha256:}"
          case "$hex" in
            *[!0-9a-f]*)
              echo "FATAL: ${digest} is not lowercase hexadecimal." >&2; exit 1 ;;
          esac
          [ "${#hex}" -eq 64 ] || {
            echo "FATAL: ${digest} is ${#hex} characters, not 64." >&2; exit 1; }
          echo "image=ghcr.io/${REPO}@${digest}" >> "$GITHUB_OUTPUT"
          echo "${TAGGED_IMAGE} is ${digest}"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      # Prove the pairing where it is provable. A `sha-<full>` tag names its own commit, so a
      # mismatch here means the source ref was wrong and the compose file about to be shipped
      # belongs to a different release. A moving tag like `edge` cannot be checked, and this says so
      # rather than implying a guarantee it has not made.
      - name: Assert the compose file and the image come from one commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$TAG" in
            sha-*)
              want="${TAG#sha-}"
              if [ "$want" != "$head" ]; then
                echo "FATAL: image was built from ${want} but compose.yaml would come from ${head}." >&2
                echo "Re-run with source_ref=${want}." >&2
                exit 1
              fi
              echo "image and compose.yaml are both from ${head}"
              ;;
            *)
              echo "NOTE: ${TAG} is not a commit-derived tag, so the pairing cannot be verified."
              echo "compose.yaml comes from ${head}"
              ;;
          esac

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key, NOT ssh-keyscan. Scanning at deploy time trusts whatever answers, which
      # makes every deploy the one moment an attacker gets a free man-in-the-middle.
      - name: Pin the host key
        # The value arrives through `env:` rather than being interpolated into the script (gate
        # ACT001). It matters most here of anywhere in this file: an expression written into a
        # shell script is executed by that shell, and this one is a repository secret.
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Staged as separate files, not written over the live ones. Nothing on the droplet changes
      # until the heredoc below has validated them against the host's real `.env`.
      - name: Stage the compose file
        env:
          HOST: ${{ vars.TOD_DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes deploy/compose.yaml \
            "${USER_NAME}@${HOST}:${DEPLOY_PATH}/compose.yaml.incoming"

      - name: Deploy
        env:
          # A repository VARIABLE, not a secret. The hostname is in deploy/env.example, in the
          # deployment runbook and in public DNS, so secrecy buys nothing — while the log masking
          # that comes with a secret turns "the name does not resolve" into
          # `ssh: Could not resolve hostname ***`. One name is used for SSH and for HTTPS, so this
          # is also the string DEPLOY_KNOWN_HOSTS must be keyscanned against. The credential and
          # the host-key pin stay secrets.
          HOST: ${{ vars.TOD_DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ steps.digest.outputs.image }}
        run: |
          set -euo pipefail
          # QUOTED heredoc, and values cross the wire as positional arguments to `bash -s`.
          # An unquoted heredoc expands on the RUNNER, so a variable meant for the droplet gets
          # eaten by the runner's own `set -u` before the script is ever sent.
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            bash -seuo pipefail -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          deploy_path="$1"
          image_ref="$2"
          cd "$deploy_path"

          # Adopt the compose file that shipped with this release, BEFORE anything is pulled.
          #
          # It used to be hand-copied once at setup and never again, so a release could add a
          # required variable the running stack never picked up.
          if [ ! -s compose.yaml.incoming ]; then
            echo "FATAL: compose.yaml.incoming did not arrive; the staging step should have sent it." >&2
            exit 1
          fi

          # Validate the INCOMING file against this host's real .env. `config` resolves every
          # interpolation, so it fails here on a malformed compose file AND on any ${VAR:?} the
          # .env is missing — both of which would otherwise surface during `up -d`, with the old
          # container already stopped.
          docker compose -f compose.yaml.incoming --env-file .env config -q

          if [ -f compose.yaml ]; then
            cp compose.yaml compose.yaml.prev
          fi
          # `cat >`, not `mv`: writing through the existing file keeps its owner and mode, which a
          # rename from an scp-created file would silently replace.
          cat compose.yaml.incoming > compose.yaml
          rm -f compose.yaml.incoming
          echo "compose.yaml is the one that shipped with this release"

          # --- the snapshot, and its failure is FATAL ------------------------------------------
          #
          # Migrations are forward-only. This file is the only undo that exists, so a deploy that
          # could not take one must not proceed — the alternative is applying an irreversible
          # schema change to the only copy of the report log with no way back.
          #
          # `tod-serve backup` rather than a `cp` of the file: the database is in WAL mode, so the
          # bytes at /data/tod.db are not the database — the committed tail is in the `-wal` file
          # beside it — and copying the first alone is a torn read whether or not anything is
          # writing. `VACUUM INTO` runs in a read transaction and produces a complete,
          # integrity-checkable file. (The writer is stopped below before this runs, so nothing is
          # racing it; the WAL argument is about the file layout, not about concurrency.)
          #
          # It writes through the `backups` bind mount compose.yaml declares, so the file lands on
          # the host in one step. Writing into the data volume and copying it back out would work
          # and then leave a full copy of the database inside the volume it is meant to protect on
          # every deploy — this image has no shell to delete the leftover with. `docker cp` cannot
          # reach a tmpfs, so /tmp is not a way round that; the bind mount is.
          if [ ! -d backups ]; then
            echo "FATAL: ${deploy_path}/backups does not exist." >&2
            echo "install -d -o 65532 -g deploy -m 770 ${deploy_path}/backups — see docs/operations/deployment.md" >&2
            exit 1
          fi

          # Remember what is running now, so a failed migration can be put back.
          previous_image="$(sed -n 's/^TOD_DEPLOY_IMAGE=//p' .env | head -n 1)"
          [ -n "$previous_image" ] || { echo "FATAL: .env names no TOD_DEPLOY_IMAGE." >&2; exit 1; }

          # Pull FIRST, while nothing has changed. A registry problem then costs a red run and no
          # downtime, instead of a stopped service and a red run. By digest, so this is the same
          # manifest every later command resolves.
          docker pull "$image_ref"

          # --- QUIESCE, and only then snapshot and migrate ---------------------------------------
          #
          # THIS SERVICE IS ONE SQLITE WRITER (ADR-0001), and everything downstream of that
          # assumption is what makes the design work. So the old container is STOPPED before a
          # second process touches the volume.
          #
          # It is not a formality. Migration 000003 rebuilds a REFERENCED table, which SQLite's
          # 12-step ALTER requires foreign keys to be off for — and `PRAGMA foreign_keys` is a
          # no-op inside a transaction, so that migration opens its own and is not covered by
          # goose's. A container still serving through that window can read and write against a
          # table mid-rebuild, and `internal/store/migrate.go` says as much where it pins the
          # migration to a single connection for exactly this reason.
          #
          # Stopping first also fixes the snapshot's meaning: taken while the old container is
          # still accepting reports, it is missing every report accepted between the snapshot and
          # the swap — which is the window a rollback would silently discard. Taken after the
          # writer is stopped, it is the complete state the migration is about to change.
          #
          # The cost is downtime that now spans the backup and the migration rather than just the
          # container swap. That is the right trade for a service whose whole design is one writer,
          # and docs/operations/deployment.md says how long and why.
          docker compose stop tod-serve

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if docker volume inspect tod-serve_tod-data >/dev/null 2>&1; then
            # `run --rm`, not `exec`: there is deliberately nothing running to exec into. The image
            # in .env is still the OLD one here, so this is the binary that wrote the database
            # taking its own snapshot.
            if ! docker compose run --rm tod-serve backup --to "/backups/pre-${stamp}.db"; then
              echo "FATAL: could not snapshot the database; refusing to deploy." >&2
              echo "Migrations are forward-only and this file is the only undo there is." >&2
              echo "Restarting the old container; nothing has been changed." >&2
              docker compose up -d --remove-orphans tod-serve || true
              exit 1
            fi
            echo "snapshot: backups/pre-${stamp}.db ($(wc -c < "backups/pre-${stamp}.db") bytes)"
          else
            # The ONLY case that proceeds without one. There is nothing to lose yet.
            echo "no data volume yet; first deploy"
          fi

          # Keep the last ten PRE-DEPLOY snapshots, and touch nothing else in this directory.
          # `daily-*.db` from the cron in docs/operations/backup.md lives here too and has its own
          # 30-day retention; a prune over the whole directory would delete most of it on every
          # deploy, which is a backup policy quietly overwritten by a different one.
          ls -1t backups/pre-*.db 2>/dev/null | tail -n +11 | while read -r old; do rm -f -- "$old"; done

          # Pin the exact manifest, so a manual `docker compose up` on the box brings up the bytes
          # CI last deployed — not whatever the tag it was built from names today.
          sed -i "s|^TOD_DEPLOY_IMAGE=.*|TOD_DEPLOY_IMAGE=${image_ref}|" .env
          grep '^TOD_DEPLOY_IMAGE=' .env

          # --- migrate, as its own deliberate step, with nothing else on the volume ---------------
          #
          # A one-shot service in compose.yaml would do this on every `up`, restarts included, which
          # is the failure the whole rule exists for. Here it runs once, after a human approved it,
          # as the only process holding the database.
          if ! docker compose run --rm tod-serve migrate; then
            echo "FATAL: the migration failed. Putting the previous image back." >&2
            sed -i "s|^TOD_DEPLOY_IMAGE=.*|TOD_DEPLOY_IMAGE=${previous_image}|" .env
            docker compose up -d --remove-orphans tod-serve || true
            echo "" >&2
            echo "If the old container comes up, the migration applied NOTHING and the service is" >&2
            echo "back on ${previous_image}." >&2
            echo "If it refuses to start, the migration applied PARTIALLY: the old binary is now" >&2
            echo "behind the schema and says so on /readyz. Restore" >&2
            echo "  ${deploy_path}/backups/pre-${stamp}.db" >&2
            echo "— docs/operations/backup.md#restoring." >&2
            exit 1
          fi

          docker compose up -d --remove-orphans tod-serve
          docker image prune -f --filter "until=168h"
          docker compose ps
          REMOTE

      - name: Verify the deployment is actually serving
        env:
          HOST_URL: https://${{ vars.TOD_DEPLOY_HOST }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # EVERY check retries, not just the first one.
          #
          # `docker compose up -d` recreates the container, and for a moment afterwards Traefik has
          # no server for this host — it drops the router entirely and answers 404 on EVERY path,
          # including one that answered 200 a second earlier. A check with no retry lands in that
          # window and takes a deploy red against a service that is already serving correctly. The
          # asymmetry is the defect: a check with no retry is not stricter than one with a bounded
          # retry, it is just noisier, and a pipeline that cries wolf gets re-run without being read.
          #
          # A retry is only honest if it is BOUNDED and the give-up is a hard failure. Nothing here
          # degrades to a warning: after the budget, the deploy is red.
          ATTEMPTS=30
          INTERVAL=5

          # attempt <description> <command...> — run until it succeeds or the budget is spent.
          #
          # `until` rather than `if !`, because `set -e` does not apply to a command in an
          # until/while condition; writing this with a plain `if` would abort the script on the
          # first failed try and defeat the retry it is supposed to implement.
          attempt() {
            local what="$1"; shift
            local i=1
            until "$@"; do
              if [ "$i" -ge "$ATTEMPTS" ]; then
                echo "FAILED: ${what} did not succeed in ${ATTEMPTS} attempts" >&2
                return 1
              fi
              i=$((i + 1))
              sleep "$INTERVAL"
            done
            echo "ok (attempt ${i}/${ATTEMPTS}): ${what}"
          }

          liveness() { curl -fsS --max-time 10 "${HOST_URL}/healthz" -o /dev/null; }

          # Readiness answers before anything else is fetched because it says WHY when it is not
          # ready: "the database is behind the migrations this binary embeds" and "the database is
          # not reachable" are different mornings, and a 503 whose body names the reason is a better
          # first line in a failed deploy's log than a curl exit code. The body is echoed for
          # exactly that reason.
          readiness() {
            curl -fsS --max-time 15 "${HOST_URL}/readyz" -o /tmp/readyz.json || return 1
            cat /tmp/readyz.json
          }

          # The public discovery document: the API is serving, not merely alive. Fetch and assertion
          # are one retryable unit — during the routing window above a body can arrive truncated,
          # and re-fetching is the right response to that, whereas a permanently malformed one
          # exhausts the budget and fails the deploy.
          meta_serves() {
            curl -fsS --max-time 15 "${HOST_URL}/api/v1/meta" -o /tmp/meta.json || return 1
            python3 -c "
          import json
          d = json.load(open('/tmp/meta.json'))
          assert d['version'], 'meta carries no version'
          print(f\"meta ok: version={d['version']}\")
          "
          }

          # The console, and the headers the BINARY attaches to it. Traefik adds HSTS; the CSP,
          # nosniff and Referrer-Policy come from the image, so a page served without them is a
          # deploy of something other than what was tested.
          console_serves() {
            curl -fsS --max-time 15 -D /tmp/console.headers "${HOST_URL}/" -o /tmp/console.html || return 1
            grep -qi '^content-security-policy: .*frame-ancestors' /tmp/console.headers
          }

          attempt "/healthz answers"                          liveness
          attempt "/readyz reports the database is ready"     readiness
          attempt "/api/v1/meta serves a version"             meta_serves
          attempt "the console serves with its own CSP"       console_serves

          # And the running build is the one that was just deployed. Without this, a `pull` that
          # silently failed to change anything looks exactly like a successful deploy: every check
          # above passes against the container that was already there.
          #
          # Only checkable where the tag determines the version. `edge` and `latest` move, and this
          # says so rather than implying a guarantee it has not made.
          running="$(python3 -c "import json; print(json.load(open('/tmp/meta.json'))['version'])")"
          case "$TAG" in
            sha-*)
              short="${TAG#sha-}"
              want="+${short:0:7}"
              case "$running" in
                *"$want") echo "the running build is ${running}, from ${TAG}" ;;
                *) echo "FAILED: ${HOST_URL} reports ${running}, which was not built from ${TAG}" >&2
                   exit 1 ;;
              esac
              ;;
            [0-9]*)
              [ "$running" = "$TAG" ] || {
                echo "FAILED: ${HOST_URL} reports ${running}, not ${TAG}" >&2; exit 1; }
              echo "the running build is ${running}"
              ;;
            *)
              echo "NOTE: ${TAG} is a moving tag, so the running version cannot be checked against it."
              echo "the running build reports ${running}"
              ;;
          esac

          echo "deployment verified: liveness, readiness, the API, the console, and the running build"
