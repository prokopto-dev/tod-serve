# Deploy to the DigitalOcean droplet.
#
# Split from release.yml on purpose: building an image is safe and automatic, applying it to the
# machine holding the only copy of a circle's report log is neither. This workflow needs an
# environment approval on `production`, and it takes a snapshot before it changes anything.
#
# What actually happens on the host is: snapshot, pull, MIGRATE, `up -d`. Traefik already owns :443
# and picks the new container up from its labels, so there is no reverse-proxy step here.
#
# THE MIGRATE STEP IS THE ONE THING THIS DIFFERS FROM A PLAIN RESTART BY, and it is deliberate.
# `serve` does not migrate, and the rule it enforces is that a container RESTART must not migrate —
# because a restart is something Docker does at 3am with nobody watching, and migrations are
# forward-only. A step in a workflow that already required a human approval is precisely the
# deliberate act that rule asks for. There is deliberately NO one-shot migrate service with
# `service_completed_successfully` in deploy/compose.yaml: that would run on every `up`, including
# an unattended restart, which is the exact failure the rule exists for.
#
# The split of what travels and what stays: the IMAGE and the COMPOSE FILE come from the SAME
# COMMIT, which is why this checks out the triggering release rather than whatever the default
# branch has become while the deploy waited for approval. The `.env` stays on the droplet, because
# it holds secrets and a secret routed through a pipeline is a secret in that pipeline's logs, its
# cache and every fork's pull-request context.

name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.2.0, edge, sha-<full>)"
        required: true
        default: edge
      source_ref:
        description: >-
          Commit or tag the image was built from. The compose file is taken from here, so it must
          match image_tag: sha-<full> -> <full>, 1.2.0 -> v1.2.0. `edge` is built from the tip of
          main, which moves — prefer sha-<full> for anything you care about being reproducible.
        required: true
        default: main
      image_digest:
        description: >-
          Optional sha256:… manifest digest to deploy. Given, it is what ships and the tag is used
          only to find it. Omitted, the tag is resolved at deploy time — which pins whatever it
          names NOW, not necessarily what the release built, and the run says so.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Never deploy twice at once: two `compose up` runs against one SQLite volume is exactly the
  # situation the single-writer design assumes cannot happen — and two `migrate` runs against one
  # database is worse.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / production
    runs-on: ubuntu-24.04

    # `packages: read` is here for one step: resolving the release tag to a manifest digest. The
    # deploy publishes nothing and needs no write anywhere.
    permissions:
      contents: read
      # For resolving a tag to a digest, when there is no release artifact to read one from.
      packages: read
      # For reading the triggering Release run's artifact — the digest it actually published.
      actions: read

    # Requires the `production` environment. Put a required reviewer on it in repository settings:
    # that is what makes a deploy a decision rather than a side effect of merging — and it is what
    # makes the migrate step below a deliberate act rather than an automatic one.
    environment:
      name: production
      url: https://${{ vars.TOD_DEPLOY_HOST }}

    # Do not deploy a build that failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # Resolved BEFORE the checkout, because it decides what the checkout takes.
      #
      # The image and the compose file must come from ONE commit. A deploy waits for a human on the
      # production environment, and `main` keeps moving while it waits — so checking out the default
      # branch would stage a compose file from a release this image was never built for. It would
      # not even look wrong: the run is green, the image is the pinned one, and the container comes
      # up with variables from somewhere else entirely.
      #
      # Values are passed through `env:` rather than interpolated into the script, so a crafted
      # dispatch input is data and never a line of shell (gate ACT001).
      # The three repository variables this deploy cannot run without.
      #
      # Checked FIRST, because the failure without it is unhelpful and expensive: an unset
      # TOD_DEPLOY_HOST reaches `scp` as an empty string and fails with
      # `ssh: Could not resolve hostname : Name or service not known` — eight steps in, after the
      # approval has been spent. That happened on the first real deploy of this workflow.
      #
      # They are VARIABLES rather than secrets precisely so this message can name them; a masked
      # value would render the same failure as `hostname ***`.
      - name: The deploy variables are set
        env:
          HOST: ${{ vars.TOD_DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HOST:-}" ]        || missing="${missing} vars.TOD_DEPLOY_HOST"
          [ -n "${USER_NAME:-}" ]   || missing="${missing} vars.DEPLOY_USER"
          [ -n "${DEPLOY_PATH:-}" ] || missing="${missing} vars.DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "FATAL: unset repository variable(s):${missing}" >&2
            echo "Settings -> Secrets and variables -> Actions -> Variables." >&2
            echo "See docs/operations/deployment.md, step 4." >&2
            exit 1
          fi
          echo "deploying to ${USER_NAME}@${HOST}:${DEPLOY_PATH}"

      - name: Resolve the image and the commit it was built from
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_REF: ${{ github.event.inputs.source_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            # The release that triggered this run. One commit, both values.
            tag="sha-${RUN_SHA}"
            ref="$RUN_SHA"
          else
            tag="$INPUT_TAG"
            ref="$INPUT_REF"
          fi
          [ -n "$tag" ] || { echo "FATAL: image_tag is empty." >&2; exit 1; }
          [ -n "$ref" ] || { echo "FATAL: source_ref is empty." >&2; exit 1; }

          # Reject these values, do not encode them.
          #
          # $GITHUB_OUTPUT is a line-oriented `name=value` file, so a value containing a newline is
          # not an odd value — it is extra RECORDS. An image_tag of
          # "edge<newline>image=ghcr.io/attacker/evil:x" appends a second `image=` line, the LAST
          # one wins, and the deploy pulls and starts whatever it names, on production, past the
          # environment approval that was meant to be the control.
          #
          # The delimiter form would stop the injection and then hand `docker pull` a two-line image
          # reference instead, which is not an improvement. Neither of these is ever anything but a
          # plain token, so the honest answer is to refuse.
          #
          # `case`, not `grep`: grep is LINE-oriented, so `grep -E '^[A-Za-z0-9._-]+$'` matches the
          # first line of a multiline value and waves this exact attack through. A shell pattern
          # tests the whole string, newline included.
          case "$tag" in
            -* | *[!A-Za-z0-9._-]*)
              echo "FATAL: image_tag must be an OCI tag: letters, digits, '.', '_', '-'." >&2
              exit 1 ;;
          esac
          # `..` is not legal in a git ref, and a leading dash would be read as an option by the
          # commands these values reach.
          case "$ref" in
            -* | *..* | *[!A-Za-z0-9._/-]*)
              echo "FATAL: source_ref must be a commit sha, tag or branch name." >&2
              exit 1 ;;
          esac
          [ "${#tag}" -le 128 ] || { echo "FATAL: image_tag exceeds 128 characters." >&2; exit 1; }
          [ "${#ref}" -le 255 ] || { echo "FATAL: source_ref exceeds 255 characters." >&2; exit 1; }

          {
            echo "tag=${tag}"
            echo "source_ref=${ref}"
            echo "tagged_image=ghcr.io/${REPO}:${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "deploying ${tag} from ${ref}"

      # THE DIGEST THE APPROVED RELEASE ACTUALLY PUBLISHED.
      #
      # `Release` writes it to an artifact; this reads it back off the triggering run. That is the
      # whole point: an environment approval has to mean the bytes that run built. Re-resolving the
      # tag here would pin whatever it names at approval time, and the gap between the two is
      # however long the approval sat in somebody's queue.
      #
      # `continue-on-error`, because there are two events. A `workflow_dispatch` of an older release
      # has no triggering run to read, and the step below handles that honestly rather than this one
      # failing the deploy.
      - name: Read the digest the release published
        id: released
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digest
          path: released
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools inspect` below talks to the registry rather than to a builder, but buildx is
      # set up explicitly rather than relied on being present: a deploy that fails on a missing
      # tool is a deploy that fails for a reason nobody reading the log would guess.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Read-only, and only so the tag below can be resolved to a digest. The deploy publishes
      # nothing.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DECIDE WHICH MANIFEST SHIPS, in one place, from three possible sources in order of how much
      # they are worth:
      #
      #   1. the artifact the triggering Release wrote      — the bytes the approval was FOR
      #   2. an explicit `image_digest` dispatch input      — an operator naming exact bytes
      #   3. the tag, resolved now                          — a fallback, and the run says so
      #
      # A `sha-<commit>` tag is still an OCI TAG: its name is derived from a commit, which makes it
      # look immutable and does not make it so. Only (1) and (2) actually pin what was approved;
      # (3) pins what the registry says at this moment, which is better than resolving the tag three
      # more times but is not the same guarantee, so it is labelled rather than blurred.
      #
      # Whatever is chosen becomes the ONE reference for the whole deploy — pull, migrate, `up -d`,
      # and every `docker compose up` on the box afterwards, because it is what lands in `.env`.
      # Without it those each resolve the reference independently.
      - name: Decide which manifest to deploy
        id: digest
        env:
          EVENT: ${{ github.event_name }}
          TAGGED_IMAGE: ${{ steps.release.outputs.tagged_image }}
          INPUT_DIGEST: ${{ github.event.inputs.image_digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # valid_digest <value> — the shape check, in three parts, the same way the dispatch
          # inputs above are checked. This value is about to be written into `.env` on the droplet
          # and handed to `docker pull`.
          valid_digest() {
            case "$1" in sha256:*) ;; *) return 1 ;; esac
            hex="${1#sha256:}"
            case "$hex" in *[!0-9a-f]*) return 1 ;; esac
            [ "${#hex}" -eq 64 ]
          }

          # Not `source`: that is a shell builtin, and a variable sharing its name reads as a
          # command every time somebody skims this.
          # AN AUTOMATED DEPLOY DOES NOT DOWNGRADE.
          #
          # A `workflow_run` deploy has a triggering Release, so its digest artifact must be
          # readable. Falling through to the tag here would quietly turn the strongest pairing this
          # pipeline has into the weakest one, on the path nobody watches — the artifact could be
          # missing because it expired, because the upload failed, or because somebody removed
          # `actions: read`, and none of those should be answered by deploying whatever the tag
          # names today. The fallback below exists for `workflow_dispatch`, which never has one.
          if [ "$EVENT" = "workflow_run" ] && [ ! -s released/image-digest.txt ]; then
            echo "FATAL: this deploy was triggered by a Release run, and that run's image-digest" >&2
            echo "artifact could not be read. Refusing to fall back to the tag: an approval has to" >&2
            echo "mean the bytes the approved run built." >&2
            echo "" >&2
            echo "Either re-run the Release workflow for this commit, or deploy deliberately with" >&2
            echo "the digest that run printed:" >&2
            echo "  gh workflow run Deploy -f image_tag=<tag> -f source_ref=<ref> \\" >&2
            echo "    -f image_digest=sha256:<digest>" >&2
            exit 1
          fi

          digest_source=""
          digest=""
          if [ -s released/image-digest.txt ]; then
            digest="$(tr -d '[:space:]' < released/image-digest.txt)"
            digest_source="the artifact the triggering Release published"
          elif [ -n "${INPUT_DIGEST:-}" ]; then
            digest="$INPUT_DIGEST"
            digest_source="the image_digest input"
          fi

          if [ -n "$digest" ]; then
            valid_digest "$digest" || {
              echo "FATAL: ${digest_source} gave ${digest}, which is not a sha256:<64 hex> digest." >&2
              exit 1; }
            echo "deploying ${digest} — ${digest_source}"

            # What the tag points at NOW, for information only. A disagreement means the tag moved
            # after the release: a rebuild, or somebody else. Either way the approved bytes are what
            # ships, so this is reported loudly and is not a failure — failing here would refuse to
            # deploy the very thing that was approved.
            current="$(docker buildx imagetools inspect "$TAGGED_IMAGE" \
                       --format '{{.Manifest.Digest}}' 2>/dev/null || echo "unresolvable")"
            if [ "$current" != "$digest" ]; then
              echo "::warning::${TAGGED_IMAGE} now resolves to ${current}, not the approved ${digest}."
              echo "WARNING: the tag has moved since this release was built."
              echo "  approved: ${digest}"
              echo "  tag now:  ${current}"
              echo "Deploying the APPROVED digest. If that is not what you want, stop this run."
            fi
          else
            # No artifact and no input. Resolve the tag, and say plainly that this is a weaker
            # pairing rather than implying a guarantee it has not made.
            echo "NOTE: no release digest was available, so ${TAGGED_IMAGE} is being resolved now."
            echo "That pins what the tag names at this moment, which is not necessarily what the"
            echo "release built. Pass -f image_digest=sha256:… to name exact bytes."
            digest="$(docker buildx imagetools inspect "$TAGGED_IMAGE" --format '{{.Manifest.Digest}}')"
            valid_digest "$digest" || {
              echo "FATAL: ${TAGGED_IMAGE} resolved to ${digest}, which is not a sha256:<64 hex> digest." >&2
              exit 1; }
            echo "${TAGGED_IMAGE} is ${digest}"
          fi

          echo "image=ghcr.io/${REPO}@${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      # Prove the pairing where it is provable. A `sha-<full>` tag names its own commit, so a
      # mismatch here means the source ref was wrong and the compose file about to be shipped
      # belongs to a different release. A moving tag like `edge` cannot be checked, and this says so
      # rather than implying a guarantee it has not made.
      - name: Assert the compose file and the image come from one commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$TAG" in
            sha-*)
              want="${TAG#sha-}"
              if [ "$want" != "$head" ]; then
                echo "FATAL: image was built from ${want} but compose.yaml would come from ${head}." >&2
                echo "Re-run with source_ref=${want}." >&2
                exit 1
              fi
              echo "image and compose.yaml are both from ${head}"
              ;;
            *)
              echo "NOTE: ${TAG} is not a commit-derived tag, so the pairing cannot be verified."
              echo "compose.yaml comes from ${head}"
              ;;
          esac

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key, NOT ssh-keyscan. Scanning at deploy time trusts whatever answers, which
      # makes every deploy the one moment an attacker gets a free man-in-the-middle.
      - name: Pin the host key
        # The value arrives through `env:` rather than being interpolated into the script (gate
        # ACT001). It matters most here of anywhere in this file: an expression written into a
        # shell script is executed by that shell, and this one is a repository secret.
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Staged as separate files, not written over the live ones. Nothing on the droplet changes
      # until the heredoc below has validated them against the host's real `.env`.
      - name: Stage the compose file
        env:
          HOST: ${{ vars.TOD_DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes deploy/compose.yaml \
            "${USER_NAME}@${HOST}:${DEPLOY_PATH}/compose.yaml.incoming"

      - name: Deploy
        id: deploy
        env:
          # A repository VARIABLE, not a secret. The hostname is in deploy/env.example, in the
          # deployment runbook and in public DNS, so secrecy buys nothing — while the log masking
          # that comes with a secret turns "the name does not resolve" into
          # `ssh: Could not resolve hostname ***`. One name is used for SSH and for HTTPS, so this
          # is also the string DEPLOY_KNOWN_HOSTS must be keyscanned against. The credential and
          # the host-key pin stay secrets.
          HOST: ${{ vars.TOD_DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ steps.digest.outputs.image }}
        run: |
          set -euo pipefail
          # QUOTED heredoc, and values cross the wire as positional arguments to `bash -s`.
          # An unquoted heredoc expands on the RUNNER, so a variable meant for the droplet gets
          # eaten by the runner's own `set -u` before the script is ever sent.
          # Piped through `tee`, so the one fact the next step needs — did this deploy CREATE the
          # volume — comes out of the remote script rather than being guessed from a symptom later.
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            bash -seuo pipefail -s -- "$DEPLOY_PATH" "$IMAGE_REF" "$HOST" <<'REMOTE' | tee "$RUNNER_TEMP/deploy.out"
          deploy_path="$1"
          image_ref="$2"
          expected_host="$3"
          cd "$deploy_path"

          # The compose file that shipped with this release is VALIDATED now and ADOPTED later.
          #
          # Validated first, because `config` resolves every interpolation and so fails here on a
          # malformed file AND on any ${VAR:?} the .env is missing — both of which would otherwise
          # surface during `up -d`, with the old container already stopped. Nothing on disk changes.
          #
          # Adopted later — after the old container has been stopped and snapshotted — because
          # until then every `docker compose` command in this script is OPERATING THE OLD IMAGE, and
          # it must be operated through the configuration it was released with. A new compose file
          # can rename the service, rename the volume, or change a mount; driving the old container
          # through it can stop the wrong thing, and could snapshot a DIFFERENT volume and report
          # success. The image and the compose file are paired, and that pairing holds on the way
          # out as well as on the way in.
          if [ ! -s compose.yaml.incoming ]; then
            echo "FATAL: compose.yaml.incoming did not arrive; the staging step should have sent it." >&2
            exit 1
          fi
          docker compose -f compose.yaml.incoming --env-file .env config -q
          echo "the compose file that shipped with this release resolves against this host's .env"

          # THE HOSTNAME IS ONE STRING WRITTEN DOWN FIVE TIMES, and nothing used to compare any two
          # of them: this `.env`, the repository variable this deploy reads, `instance.public_url`,
          # every enabled provider's `redirect_uri`, and the identity provider's own dashboard.
          #
          # These two are the pair a deploy can check, and it costs one grep of a line that is not a
          # secret. A disagreement here means the deploy is about to route, certificate and
          # advertise a different name than the one it verifies afterwards — and the compose file
          # builds TOD_PUBLIC_URL out of this value, so the instance would go on handing out join
          # links for it. The other pair is checked by `tod-serve doctor` at the end of this run.
          env_host="$(sed -n 's/^TOD_DEPLOY_HOST=//p' .env | head -n 1 | tr -d '[:space:]')"
          if [ "$env_host" != "$expected_host" ]; then
            echo "FATAL: ${deploy_path}/.env says TOD_DEPLOY_HOST=${env_host:-<unset>}," >&2
            echo "but this deploy was told the host is ${expected_host}." >&2
            echo "One of them is wrong. Nothing has been changed." >&2
            exit 1
          fi
          echo "TOD_DEPLOY_HOST agrees with the repository variable (${expected_host})"

          # --- the snapshot, and its failure is FATAL ------------------------------------------
          #
          # Migrations are forward-only. This file is the only undo that exists, so a deploy that
          # could not take one must not proceed — the alternative is applying an irreversible
          # schema change to the only copy of the report log with no way back.
          #
          # `tod-serve backup` rather than a `cp` of the file: the database is in WAL mode, so the
          # bytes at /data/tod.db are not the database — the committed tail is in the `-wal` file
          # beside it — and copying the first alone is a torn read whether or not anything is
          # writing. `VACUUM INTO` runs in a read transaction and produces a complete,
          # integrity-checkable file. (The writer is stopped below before this runs, so nothing is
          # racing it; the WAL argument is about the file layout, not about concurrency.)
          #
          # It writes through the `backups` bind mount compose.yaml declares, so the file lands on
          # the host in one step. Writing into the data volume and copying it back out would work
          # and then leave a full copy of the database inside the volume it is meant to protect on
          # every deploy — this image has no shell to delete the leftover with. `docker cp` cannot
          # reach a tmpfs, so /tmp is not a way round that; the bind mount is.
          if [ ! -d backups ]; then
            echo "FATAL: ${deploy_path}/backups does not exist." >&2
            echo "install -d -o 65532 -g deploy -m 770 ${deploy_path}/backups — see docs/operations/deployment.md" >&2
            exit 1
          fi

          # Remember what is running now, so a failed migration can be put back.
          previous_image="$(sed -n 's/^TOD_DEPLOY_IMAGE=//p' .env | head -n 1)"
          [ -n "$previous_image" ] || { echo "FATAL: .env names no TOD_DEPLOY_IMAGE." >&2; exit 1; }

          # Pull FIRST, while nothing has changed. A registry problem then costs a red run and no
          # downtime, instead of a stopped service and a red run. By digest, so this is the same
          # manifest every later command resolves.
          docker pull "$image_ref"

          # EVERY `docker compose run` AND `exec` BELOW REDIRECTS STDIN, and that is not decoration.
          #
          # This whole script arrives on the remote shell's STDIN — `ssh … bash -s` — and both
          # `compose run` and `compose exec` ATTACH STDIN by default. Without `</dev/null` the first
          # one swallows the rest of the script: bash reads EOF, exits 0, and the deploy reports
          # success having silently skipped everything after it. That is not hypothetical. It is
          # what happened on 2026-08-25: `migrate` ran, `up -d` never did, this step went green, and
          # the verification below spent thirty attempts reporting the symptom.
          #
          # `-T` alone does NOT fix it — that disables the TTY, not the stdin attachment. Gate
          # ACT003 checks every workflow for this.

          # --- QUIESCE, and only then snapshot and migrate ---------------------------------------
          #
          # THIS SERVICE IS ONE SQLITE WRITER (ADR-0001), and everything downstream of that
          # assumption is what makes the design work. So the old container is STOPPED before a
          # second process touches the volume.
          #
          # It is not a formality. Migration 000003 rebuilds a REFERENCED table, which SQLite's
          # 12-step ALTER requires foreign keys to be off for — and `PRAGMA foreign_keys` is a
          # no-op inside a transaction, so that migration opens its own and is not covered by
          # goose's. A container still serving through that window can read and write against a
          # table mid-rebuild, and `internal/store/migrate.go` says as much where it pins the
          # migration to a single connection for exactly this reason.
          #
          # Stopping first also fixes the snapshot's meaning: taken while the old container is
          # still accepting reports, it is missing every report accepted between the snapshot and
          # the swap — which is the window a rollback would silently discard. Taken after the
          # writer is stopped, it is the complete state the migration is about to change.
          #
          # The cost is downtime that now spans the backup and the migration rather than just the
          # container swap. That is the right trade for a service whose whole design is one writer,
          # and docs/operations/deployment.md says how long and why.
          docker compose stop tod-serve

          # A MISSING VOLUME IS NOT PROOF THAT THIS HOST HAS NEVER BEEN DEPLOYED.
          #
          # `docker volume inspect` says what is true now, not what has ever been true. A volume
          # somebody removed with `down -v`, or pruned, or lost to a renamed volume in a release,
          # produces exactly the state a first installation does — and then this deploy would
          # migrate a fresh empty database over a real instance, bring it up, waive doctor's
          # complaints about the missing rows, and go GREEN. A silent, confirmed data loss.
          #
          # So the answer comes from a marker that lives on the HOST, beside .env and outside the
          # volume, written the first time this workflow brought the service up. It is durable and
          # independent: losing the volume does not lose it.
          #
          #   no marker, no volume    a first installation. The only state the waiver applies to
          #   no marker, volume       an install that predates this marker. Treated as established,
          #                           which is the strict reading, and the marker is written
          #   marker, volume          the ordinary case
          #   marker, NO volume       refused. Something removed the data from a host that has been
          #                           deployed before, and this must not be blessed by a green run
          installed_marker=".tod-serve-installed"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if docker volume inspect tod-serve_tod-data >/dev/null 2>&1; then
            # `run --rm`, not `exec`: there is deliberately nothing running to exec into. The image
            # in .env is still the OLD one here, so this is the binary that wrote the database
            # taking its own snapshot.
            if ! docker compose run --rm -T tod-serve backup --to "/backups/pre-${stamp}.db" </dev/null; then
              echo "FATAL: could not snapshot the database; refusing to deploy." >&2
              echo "Migrations are forward-only and this file is the only undo there is." >&2
              echo "Restarting the old container; nothing has been changed." >&2
              docker compose up -d --remove-orphans tod-serve || true
              exit 1
            fi
            echo "snapshot: backups/pre-${stamp}.db ($(wc -c < "backups/pre-${stamp}.db") bytes)"

            # AND THE SNAPSHOT IS OPENED BEFORE IT IS TRUSTED.
            #
            # `tod-serve backup` reports success against a database that is not the one you meant.
            # Point it at a fresh empty volume — which is what a compose file naming a volume that
            # does not exist gets — and it writes a perfectly valid 4 KB SQLite file and exits 0.
            # That was reproduced, and it is the worst outcome a pre-deploy snapshot can have: the
            # deploy proceeds believing it has an undo it does not have.
            #
            # `doctor` opens the copy and says what it is. Its EXIT CODE is deliberately ignored:
            # an instance that has been migrated but not yet `init`ed is a real state between the
            # first deploy and the operator's bootstrap, and doctor calls that a problem. What is
            # required is narrower and is exactly "this is the live database": the migrations are
            # current, and it passes an integrity check.
            #
            # The greps fail CLOSED. If doctor's wording ever changes, this stops the deploy rather
            # than waving it through.
            report="$(docker compose run --rm -T tod-serve doctor --db "/backups/pre-${stamp}.db" 2>&1 </dev/null || true)"
            printf '%s\n' "$report"
            if ! printf '%s' "$report" | grep -q 'migrations are up to date' ||
               ! printf '%s' "$report" | grep -q 'integrity check passed'; then
              echo "FATAL: the snapshot is not a current tod-serve database; refusing to deploy." >&2
              echo "An empty or unmigrated snapshot means the backup ran against the wrong volume," >&2
              echo "or the copy is damaged. Either way there is no undo, and migrations are" >&2
              echo "forward-only." >&2
              echo "Restarting the old container; nothing has been changed." >&2
              docker compose up -d --remove-orphans tod-serve || true
              exit 1
            fi
            echo "the snapshot opens, its migrations are current, and it passes an integrity check"
          elif [ -f "$installed_marker" ]; then
            echo "FATAL: this host has been deployed before, and the data volume is GONE." >&2
            echo "" >&2
            sed 's/^/  /' "$installed_marker" >&2
            echo "" >&2
            echo "Continuing would migrate an empty database, start it, and report success — a" >&2
            echo "data loss confirmed by a green deploy. Refusing." >&2
            echo "" >&2
            echo "If the volume was removed deliberately and starting empty is what you want," >&2
            echo "delete ${deploy_path}/${installed_marker} to say so, and re-run." >&2
            exit 1
          else
            # The ONLY state that proceeds without a snapshot, and the only one the doctor waiver
            # downstream will accept: nothing has ever been installed here, so there is nothing to
            # lose and nothing to have bootstrapped.
            echo "no data volume and no install marker; first installation"
          fi

          # Keep the last ten PRE-DEPLOY snapshots, and touch nothing else in this directory.
          # `daily-*.db` from the cron in docs/operations/backup.md lives here too and has its own
          # 30-day retention; a prune over the whole directory would delete most of it on every
          # deploy, which is a backup policy quietly overwritten by a different one.
          #
          # `|| true` is load-bearing, not laziness: on the FIRST deploy there is no snapshot at all,
          # `grep` matches nothing and exits non-zero, and under `set -o pipefail` that would abort
          # the deploy here — before it ever started the service it was meant to install. The set is
          # collected first and the loop is skipped when it is empty, so "nothing to prune" and
          # "prune failed" are different outcomes rather than the same exit code.
          old_snapshots="$(ls -1t backups/ 2>/dev/null | grep '^pre-.*\.db$' | tail -n +11 || true)"
          if [ -n "$old_snapshots" ]; then
            printf '%s\n' "$old_snapshots" | while read -r old; do rm -f -- "backups/$old"; done
          fi

          # --- from here on, the NEW release: its compose file and its image ----------------------
          #
          # Everything above operated the old container through the compose file it was released
          # with. The swap happens here, in one place, once the old writer is stopped and its
          # snapshot is on disk.
          #
          # `cat >`, not `mv`: writing through the existing file keeps its owner and mode, which a
          # rename from an scp-created file would silently replace.
          if [ -f compose.yaml ]; then
            cp compose.yaml compose.yaml.prev
          fi
          cat compose.yaml.incoming > compose.yaml
          rm -f compose.yaml.incoming
          echo "compose.yaml is the one that shipped with this release"

          # Pin the exact manifest, so a manual `docker compose up` on the box brings up the bytes
          # CI last deployed — not whatever the tag it was built from names today.
          sed -i "s|^TOD_DEPLOY_IMAGE=.*|TOD_DEPLOY_IMAGE=${image_ref}|" .env
          grep '^TOD_DEPLOY_IMAGE=' .env

          # --- migrate, as its own deliberate step, with nothing else on the volume ---------------
          #
          # A one-shot service in compose.yaml would do this on every `up`, restarts included, which
          # is the failure the whole rule exists for. Here it runs once, after a human approved it,
          # as the only process holding the database.
          if ! docker compose run --rm -T tod-serve migrate </dev/null; then
            echo "FATAL: the migration failed. Putting the previous release back." >&2
            # BOTH halves, because they are a pair: the old image has to come back up under the
            # compose file it was released with, not under the one that shipped with the release
            # that just failed.
            if [ -f compose.yaml.prev ]; then
              cat compose.yaml.prev > compose.yaml
            fi
            sed -i "s|^TOD_DEPLOY_IMAGE=.*|TOD_DEPLOY_IMAGE=${previous_image}|" .env
            docker compose up -d --remove-orphans tod-serve || true
            echo "" >&2
            echo "If the old container comes up, the migration applied NOTHING and the service is" >&2
            echo "back on ${previous_image}." >&2
            echo "If it refuses to start, the migration applied PARTIALLY: the old binary is now" >&2
            echo "behind the schema and says so on /readyz. Restore" >&2
            echo "  ${deploy_path}/backups/pre-${stamp}.db" >&2
            echo "— docs/operations/backup.md#restoring." >&2
            exit 1
          fi

          docker compose up -d --remove-orphans tod-serve

          # Written only after the service is actually up, so a run that died earlier does not
          # leave a marker claiming an installation that never happened.
          if [ ! -f "$installed_marker" ]; then
            {
              printf 'installed %s\n' "$stamp"
              printf 'image     %s\n' "$image_ref"
              printf 'This file is how the deploy tells a first installation from a host whose data\n'
              printf 'volume has gone missing. Do not delete it unless you mean the second one.\n'
            } > "$installed_marker"
            echo "wrote ${installed_marker}"
          fi

          docker image prune -f --filter "until=168h"
          docker compose ps
          REMOTE

          # The marker the remote script printed when `docker volume inspect` found nothing. This is
          # the ONLY thing that makes "this instance has never been bootstrapped" a fact rather than
          # an inference from a missing row.
          if grep -q '^no data volume and no install marker; first installation$' "$RUNNER_TEMP/deploy.out"; then
            echo "first_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "first_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the deployment is actually serving
        env:
          HOST_URL: https://${{ vars.TOD_DEPLOY_HOST }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # EVERY check retries, not just the first one.
          #
          # `docker compose up -d` recreates the container, and for a moment afterwards Traefik has
          # no server for this host — it drops the router entirely and answers 404 on EVERY path,
          # including one that answered 200 a second earlier. A check with no retry lands in that
          # window and takes a deploy red against a service that is already serving correctly. The
          # asymmetry is the defect: a check with no retry is not stricter than one with a bounded
          # retry, it is just noisier, and a pipeline that cries wolf gets re-run without being read.
          #
          # A retry is only honest if it is BOUNDED and the give-up is a hard failure. Nothing here
          # degrades to a warning: after the budget, the deploy is red.
          ATTEMPTS=30
          INTERVAL=5

          # attempt <description> <command...> — run until it succeeds or the budget is spent.
          #
          # `until` rather than `if !`, because `set -e` does not apply to a command in an
          # until/while condition; writing this with a plain `if` would abort the script on the
          # first failed try and defeat the retry it is supposed to implement.
          attempt() {
            local what="$1"; shift
            local i=1
            until "$@"; do
              if [ "$i" -ge "$ATTEMPTS" ]; then
                echo "FAILED: ${what} did not succeed in ${ATTEMPTS} attempts" >&2
                return 1
              fi
              i=$((i + 1))
              sleep "$INTERVAL"
            done
            echo "ok (attempt ${i}/${ATTEMPTS}): ${what}"
          }

          liveness() { curl -fsS --max-time 10 "${HOST_URL}/healthz" -o /dev/null; }

          # Readiness answers before anything else is fetched because it says WHY when it is not
          # ready: "the database is behind the migrations this binary embeds" and "the database is
          # not reachable" are different mornings, and a 503 whose body names the reason is a better
          # first line in a failed deploy's log than a curl exit code. The body is echoed for
          # exactly that reason.
          readiness() {
            curl -fsS --max-time 15 "${HOST_URL}/readyz" -o /tmp/readyz.json || return 1
            cat /tmp/readyz.json
          }

          # The public discovery document: the API is serving, not merely alive. Fetch and assertion
          # are one retryable unit — during the routing window above a body can arrive truncated,
          # and re-fetching is the right response to that, whereas a permanently malformed one
          # exhausts the budget and fails the deploy.
          meta_serves() {
            curl -fsS --max-time 15 "${HOST_URL}/api/v1/meta" -o /tmp/meta.json || return 1
            python3 -c "
          import json
          d = json.load(open('/tmp/meta.json'))
          assert d['version'], 'meta carries no version'
          print(f\"meta ok: version={d['version']}\")
          "
          }

          # The console, and the headers the BINARY attaches to it. Traefik adds HSTS; the CSP,
          # nosniff and Referrer-Policy come from the image, so a page served without them is a
          # deploy of something other than what was tested.
          console_serves() {
            curl -fsS --max-time 15 -D /tmp/console.headers "${HOST_URL}/" -o /tmp/console.html || return 1
            grep -qi '^content-security-policy: .*frame-ancestors' /tmp/console.headers
          }

          attempt "/healthz answers"                          liveness
          attempt "/readyz reports the database is ready"     readiness
          attempt "/api/v1/meta serves a version"             meta_serves
          attempt "the console serves with its own CSP"       console_serves

          # And the running build is the one that was just deployed. Without this, a `pull` that
          # silently failed to change anything looks exactly like a successful deploy: every check
          # above passes against the container that was already there.
          #
          # Only checkable where the tag determines the version. `edge` and `latest` move, and this
          # says so rather than implying a guarantee it has not made.
          running="$(python3 -c "import json; print(json.load(open('/tmp/meta.json'))['version'])")"
          case "$TAG" in
            sha-*)
              short="${TAG#sha-}"
              want="+${short:0:7}"
              case "$running" in
                *"$want") echo "the running build is ${running}, from ${TAG}" ;;
                *) echo "FAILED: ${HOST_URL} reports ${running}, which was not built from ${TAG}" >&2
                   exit 1 ;;
              esac
              ;;
            [0-9]*)
              [ "$running" = "$TAG" ] || {
                echo "FAILED: ${HOST_URL} reports ${running}, not ${TAG}" >&2; exit 1; }
              echo "the running build is ${running}"
              ;;
            *)
              echo "NOTE: ${TAG} is a moving tag, so the running version cannot be checked against it."
              echo "the running build reports ${running}"
              ;;
          esac

          echo "deployment verified: liveness, readiness, the API, the console, and the running build"

      # And the instance's own opinion of itself, once it is definitely serving.
      #
      # AFTER the checks above, deliberately: `doctor` opens the database, and asking it anything
      # before `/readyz` has answered would report a problem that is really "the container has not
      # finished starting". By here the service is up and every answer it gives is about the
      # instance rather than about the deploy.
      #
      # What this buys that HTTP cannot: doctor compares the copies of the hostname this binary can
      # see — `instance.public_url`, `$TOD_PUBLIC_URL` and every enabled provider's `redirect_uri` —
      # and a disagreement there is invisible from outside. `spaJoinURL` prefers the environment
      # over the stored row, so the join links look right while the stored URL is wrong, and the
      # first symptom is an opaque OAuth error days later.
      - name: Ask the instance to check itself
        env:
          HOST: ${{ vars.TOD_DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          FIRST_DEPLOY: ${{ steps.deploy.outputs.first_deploy }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            bash -seuo pipefail -s -- "$DEPLOY_PATH" "$FIRST_DEPLOY" <<'REMOTE'
          cd "$1"
          first_deploy="$2"
          # `exec`, so this runs inside the container that is already serving rather than starting a
          # second one against the same volume.
          report="$(docker compose exec -T tod-serve /usr/local/bin/tod-serve doctor 2>&1 </dev/null || true)"
          printf '%s\n' "$report"

          # DOCTOR MUST HAVE RUN, and this is checked positively rather than by the absence of
          # complaints.
          #
          # That `|| true` is load-bearing — doctor exits non-zero whenever it finds a problem,
          # including on a first installation — and it turns "the command failed" into "the report
          # is empty". An empty report has no PROBLEM lines in it, and a check that looks only for
          # PROBLEM lines then PASSES, having never run. A failed `exec`, a container that is not
          # up, a binary at a different path: all of them looked like a healthy instance.
          #
          # So the lines doctor emits on every run, whatever it finds, are required to be there.
          for required in \
            'schema version' \
            'migrations are up to date' \
            'integrity check passed' \
            'foreign key check passed'
          do
            printf '%s' "$report" | grep -q "$required" && continue
            echo "FAILED: the report does not contain \"${required}\"." >&2
            echo "Either doctor did not run, or its output has changed shape. Either way this" >&2
            echo "check cannot vouch for the instance, so it does not." >&2
            exit 1
          done

          # EVERY problem is collected, and then the ones a genuine first deploy is ALLOWED to have
          # are subtracted by name. Anything left is red.
          #
          # There are THREE of them, and the third arrived with `instance.owner`: doctor now says
          # so when no identity can administer the instance, which on a first installation is true
          # for the same reason the other two are — nothing has been bootstrapped into the volume
          # this run created. It is a PROBLEM rather than a warning because on any LATER deploy it
          # means somebody's instance stopped having an administrator, and that is invisible from
          # outside: every HTTP check below passes on an instance nobody can configure.
          #
          # The previous shape branched on the string "no instance row" and exited 0. Two things
          # were wrong with it. A missing instance row is not proof of a first deploy — an
          # established database whose singleton was deleted, or which was restored from the wrong
          # snapshot, reaches the same branch — and the HTTP checks above still pass without that
          # row, so a broken production instance became a green deploy. And the early exit threw
          # away every OTHER problem in the report: a failed integrity check, an orphaned foreign
          # key, a public URL the providers disagree with.
          #
          # The waiver is now tied to a FACT this run established: `docker volume inspect` found no
          # volume, so this deploy created it, so nothing can have been bootstrapped into it yet.
          # On any later deploy those same two lines are problems, because by then they mean
          # somebody's instance stopped having an identity.
          problems="$(printf '%s\n' "$report" | grep '^  PROBLEM' || true)"
          if [ "$first_deploy" = "true" ]; then
            # And the waiver is only accepted against the report a first installation ACTUALLY
            # produces. "No problems to subtract" is not evidence of the bootstrap state — it is
            # equally what a report that never arrived looks like — so every problem being waived
            # has to be PRESENT before anything is waived.
            #
            # SINGLE quotes below: a backtick inside a double-quoted string is command
            # substitution, and this line runs on the droplet — it would have tried to execute the
            # verb it names. ACT002 cannot see that; `bash -n` parses it happily.
            for expected in 'no instance row' 'no identity provider is enabled' \
                            'nobody can administer this instance'; do
              printf '%s' "$report" | grep -q "$expected" && continue
              echo "FAILED: this run created the data volume, so nothing can have been" >&2
              echo "bootstrapped into it — yet doctor does not report \"${expected}\"." >&2
              echo "That is not the state this waiver is for, so it is not applied." >&2
              exit 1
            done
            echo 'NOTE: this run installed the data volume, so tod-serve init cannot have run.'
            echo "The three problems that follow from that are expected here and nowhere else."
            problems="$(printf '%s\n' "$problems" \
              | grep -v 'no instance row' \
              | grep -v 'no identity provider is enabled' \
              | grep -v 'nobody can administer this instance' || true)"
          fi

          if [ -n "$problems" ]; then
            echo "FAILED: the instance reports problems with itself:" >&2
            printf '%s\n' "$problems" >&2
            echo "" >&2
            echo "It is serving — the checks above passed — so this is configuration rather than a" >&2
            echo "bad container. A public-URL disagreement is the one that is invisible over HTTP." >&2
            exit 1
          fi

          if [ "$first_deploy" = "true" ]; then
            echo "nothing else is wrong. Bootstrap it: docs/operations/deployment.md, first deploy."
            echo "It ends with 'tod-serve instance grant --permission instance.owner'; the third"
            echo "waived problem above is doctor saying that step has not happened yet."
          else
            # The success LINE, not the exit code, so a doctor that changed its wording stops the
            # deploy rather than being waved through by an empty grep.
            printf '%s' "$report" | grep -q 'no problems found' || {
              echo "FAILED: doctor reported no PROBLEM lines and did not say it found none." >&2
              echo "Its output has changed shape; this check cannot vouch for it." >&2
              exit 1; }
            echo "the instance reports no problems"
          fi
          REMOTE
