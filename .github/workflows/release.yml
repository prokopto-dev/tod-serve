# Build and publish the container image.
#
# Runs on a tag, and on every push to main so that `:edge` always exists to deploy. The image is the
# only artefact CI produces; it carries no secrets, which is what makes it safe to publish.
#
# Actions are pinned to 40-character SHAs (gate PIN001), and base images are pinned by digest in
# deploy/Dockerfile (gate IMG001). A tag is mutable — pinning to one means trusting whoever can move
# it, on a workflow that holds a package-write token.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: build / image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The build stamps main.version, and the image carries a created timestamp. Both are taken
      # from the COMMIT rather than from "now", so two builds of the same commit produce the same
      # bytes — which is what lets you prove a running image matches a source tree. SOURCE_DATE_EPOCH
      # is what buildx reads to rewrite layer timestamps to the same instant.
      - name: Resolve build metadata
        id: vars
        run: |
          set -euo pipefail
          {
            echo "date=$(git show -s --format=%cI HEAD)"
            echo "epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="0.0.0-edge+${GITHUB_SHA::7}"
          # Filter the version before it reaches -ldflags: a tag is attacker-influenced input on a
          # public repository, and `-X` takes whatever it is given.
          echo "version=$(printf '%s' "$version" | tr -cd 'A-Za-z0-9.+_-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long
          # Overrides the action's default, which is the time of the RUN. Same argument as above:
          # two builds of one commit must not differ in their metadata either.
          labels: |
            org.opencontainers.image.created=${{ steps.vars.outputs.date }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.vars.outputs.epoch }}
        with:
          context: .
          file: deploy/Dockerfile
          # arm64 is here because a DigitalOcean droplet may well be one, and finding that out at
          # deploy time is a bad evening. Both are CROSS-COMPILED — see deploy/Dockerfile; buildx
          # with QEMU would be minutes per architecture for no benefit.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}

      # The digest this release actually published, carried forward as an artifact.
      #
      # Deploy reads it and ships THAT manifest. Re-resolving the tag at deploy time would pin
      # whatever the tag names then — and a deploy waits for a human on the production environment,
      # so "then" is however long the approval took. The approval has to mean the bytes this run
      # built, not the bytes that answer to its tag later.
      - name: Record the digest this release published
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE_DIGEST" ] || { echo "FATAL: the build reported no digest." >&2; exit 1; }
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
          # Long enough that a deploy sitting in the approval queue over a weekend still finds it.
          retention-days: 30

      - name: Summary
        # Through `env:`, not interpolated (gate ACT001). A tag list is metadata this workflow
        # computed, and it is still a value reaching a shell from an expression.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "$IMAGE_TAGS"
            echo "digest: $IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
