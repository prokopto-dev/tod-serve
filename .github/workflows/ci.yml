# CI answers one question: is this diff correct?
#
# Every step shells out to a `make` target, so what CI runs and what you run locally cannot drift.
# Actions are pinned to 40-character SHAs with the version in a trailing comment; PIN001 in
# scripts/repo-gates.sh fails any bare-tag `uses:`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs. NEVER cancel main, a tag, or a merge_group — a cancelled
  # merge-queue run wedges the queue.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never silently download a different compiler than go.mod pins.
  GOTOOLCHAIN: local

jobs:
  repo:
    name: lint / repo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Repository gates
        run: make lint-repo
      - name: Documentation gates
        run: make docs-check
      - name: Every command in AGENTS.md resolves
        run: make verify-commands

  go:
    name: build / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      # Node 24: `node --test` runs the console's TypeScript unit tests directly, with type
      # stripping on by default and no bundler in the path.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # BEFORE the Go steps, deliberately. `make build` stages the console into internal/ui/dist,
      # and internal/ui's own tests SKIP when it is absent — so a job that ran the Go suite first
      # would report success over a package that had checked nothing.
      - run: make build-web
      - run: make vet
      - run: make build
      - run: make test

  web:
    name: lint / web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ESLint (including tod/no-network-outside-api), that rule's own unit test, the as_of
      # arithmetic, and the check that web/src/api/generated.ts still matches the checked-in
      # OpenAPI document. WEB001 and WEB002 run in the `repo` job above, which has no npm at all —
      # that separation is the point of having two mechanisms.
      - run: make lint-web
      - name: The console builds
        run: make build-web

  spec:
    name: lint / openapi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The whole history, because this job compares the checked-in document against the base
          # branch's copy of it. A shallow clone has no base to compare with, and the gate would
          # skip rather than fail — which is how a renamed operationId ships.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: OpenAPI breaking-change gate
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "${BASE_REF#origin/}"
          make spec-diff

  golangci:
    name: lint / go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2

  # A single required check, so branch protection names one job rather than a list that drifts
  # every time a job is added.
  ci-required:
    name: ci-required
    runs-on: ubuntu-24.04
    needs: [repo, go, web, spec, golangci]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "a required job failed"; exit 1
          fi
          echo "all required jobs succeeded"
